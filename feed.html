<!DOCTYPE html>
<html lang="ru">
<head>

<body class="feed-body">

  <!-- Feed Top HUD Navigation Overlay -->
  <header class="feed-top-nav">

      <img src="assets/sasbov-market-logo.png" alt="SASBOV MARKET" style="height: 24px; width: auto;">

    <!-- Quick Feed Filter Chips -->
    <div class="feed-filter-bar">
      <button type="button" class="feed-chip active" data-feed-filter="all">ВСЕ (ALL)</button>
      <button type="button" class="feed-chip" data-feed-filter="japan">ЯПОНИЯ [JP]</button>
      <button type="button" class="feed-chip" data-feed-filter="china">КИТАЙ [CN]</button>
    </div>

    <div style="display: flex; gap: 0.5rem; align-items: center;">

    <!-- Generated dynamically by feed.js -->

  <footer class="feed-bottom-telemetry">
    <span class="telemetry-item">Используйте клавиши ↑ / ↓ для навигации</span>
